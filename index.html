<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мои задачи</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 16px 14px 140px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0e0f12; color: #e8e9ec;
    min-height: 100vh;
  }
  h1 { font-size: 22px; margin: 6px 0 16px; font-weight: 650; letter-spacing: -0.3px; }
  .btn-voice {
    width: 100%; padding: 18px; margin-bottom: 14px;
    background: linear-gradient(180deg, #22c55e, #16a34a);
    color: #04120a; border: none; border-radius: 16px;
    font-size: 17px; font-weight: 700; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .btn-voice.rec {
    background: linear-gradient(180deg, #ef4444, #b91c1c); color: #fff;
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.65; } }
  .transcript {
    background: #17191e; border: 1px solid #24272e; border-radius: 12px;
    padding: 12px; margin-bottom: 14px; font-size: 14px; line-height: 1.5;
    color: #a8aeba; min-height: 44px; display: none;
  }
  .transcript.on { display: block; }
  .add-box { background: #17191e; border: 1px solid #24272e; border-radius: 14px; padding: 12px; margin-bottom: 20px; }
  input[type="text"] {
    width: 100%; background: #0e0f12; border: 1px solid #2c3038; border-radius: 10px;
    padding: 12px; color: #e8e9ec; font-size: 16px; font-family: inherit; outline: none;
  }
  input::placeholder { color: #5f6673; }
  .chips { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .chip {
    flex: 1 1 auto; padding: 9px 10px; text-align: center;
    background: #0e0f12; border: 1px solid #2c3038; border-radius: 9px;
    font-size: 13px; color: #a8aeba; cursor: pointer; white-space: nowrap;
  }
  .chip.active { background: #e8e9ec; color: #0e0f12; border-color: #e8e9ec; font-weight: 600; }
  button.primary {
    margin-top: 10px; width: 100%; padding: 13px;
    background: #e8e9ec; color: #0e0f12; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer;
  }
  button.primary:active { opacity: 0.7; }
  section { margin-bottom: 22px; }
  .sec-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 9px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.7px; }
  .sec-name { font-weight: 700; }
  .sec-count { color: #5f6673; font-size: 11px; }
  .overdue .sec-name { color: #f87171; }
  .urgent .sec-name { color: #fb923c; }
  .thisweek .sec-name { color: #facc15; }
  .nextweek .sec-name { color: #60a5fa; }
  .later .sec-name { color: #a8aeba; }
  .item {
    display: flex; align-items: flex-start; gap: 10px;
    background: #17191e; border: 1px solid #24272e; border-radius: 12px;
    padding: 12px 13px; margin-bottom: 7px;
  }
  .item.done { opacity: 0.4; }
  .item.done .title { text-decoration: line-through; }
  .check {
    width: 22px; height: 22px; flex: 0 0 22px; margin-top: 1px;
    border: 2px solid #3a3f49; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .item.done .check { background: #4ade80; border-color: #4ade80; }
  .item.done .check::after { content: "✓"; color: #0e0f12; font-size: 13px; font-weight: 700; }
  .title { font-size: 15px; line-height: 1.4; word-break: break-word; }
  .meta { font-size: 12px; color: #7c828f; margin-top: 3px; }
  .meta.red { color: #f87171; }
  .empty { color: #4a505b; font-size: 13px; padding: 4px 0 2px; }
  .msg { font-size: 13px; color: #f87171; margin-top: 8px; display: none; }
</style>
</head>
<body>

<h1>Мои задачи</h1>

<button class="btn-voice" id="voice-btn">
  <span id="voice-icon">🎤</span><span id="voice-label">Сказать задачу</span>
</button>

<div class="transcript" id="transcript"></div>

<div class="add-box">
  <input type="text" id="title" placeholder="Или введите текстом" autocomplete="off">
  <div class="chips" id="chips">
    <div class="chip" data-days="0">Сегодня</div>
    <div class="chip" data-days="1">Завтра</div>
    <div class="chip" data-days="7">Через неделю</div>
    <div class="chip" data-days="">Без даты</div>
  </div>
  <button class="primary" id="add-btn">Добавить</button>
  <div class="msg" id="msg"></div>
</div>

<div id="sections"></div>

<script>
  var SUPABASE_URL = "https://gzoiwzxeejapecbjytyw.supabase.co";
  var SUPABASE_KEY = "sb_publishable_DCvY5Oi1weqMDlztu7PrfQ_VAdXVrWl";

  var titleEl = document.getElementById("title");
  var sectionsEl = document.getElementById("sections");
  var msgEl = document.getElementById("msg");
  var chipsEl = document.getElementById("chips");
  var voiceBtn = document.getElementById("voice-btn");
  var voiceLabel = document.getElementById("voice-label");
  var voiceIcon = document.getElementById("voice-icon");
  var transcriptEl = document.getElementById("transcript");
  var selectedDays = "";

  function headers(extra) {
    var h = { "apikey": SUPABASE_KEY, "Content-Type": "application/json" };
    if (extra) for (var k in extra) h[k] = extra[k];
    return h;
  }
  function showError(e) { msgEl.textContent = String(e.message || e); msgEl.style.display = "block"; }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function isoDate(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function today() { var d = new Date(); d.setHours(0,0,0,0); return d; }
  function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
  function fmtDate(s) { var p = s.split("-"); return p[2] + "." + p[1] + "." + p[0]; }

  var buckets = ["overdue", "urgent", "thisweek", "nextweek", "later"];
  var names = {
    overdue: "Просроченные", urgent: "Срочные", thisweek: "На этой неделе",
    nextweek: "На следующей неделе", later: "Без срока"
  };

  function bucketOf(task) {
    if (!task.due_date) return "later";
    var diff = daysBetween(today(), new Date(task.due_date + "T00:00:00"));
    if (diff < 0) return "overdue";
    if (diff <= 1) return "urgent";
    if (diff <= 6) return "thisweek";
    return "nextweek";
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function render(tasks) {
    var groups = { overdue: [], urgent: [], thisweek: [], nextweek: [], later: [] };
    tasks.filter(function (t) { return t.status !== "done"; })
      .forEach(function (t) { groups[bucketOf(t)].push(t); });

    var html = "";
    buckets.forEach(function (b) {
      var list = groups[b];
      if (!list.length) return;
      html += '<section class="' + b + '"><div class="sec-head"><span class="sec-name">' + names[b] +
        '</span><span class="sec-count">' + list.length + '</span></div>';
      list.forEach(function (t) {
        var meta = t.due_date ? "до " + fmtDate(t.due_date) : "без срока";
        html += '<div class="item" data-id="' + t.id + '" data-status="' + t.status + '">' +
          '<div class="check"></div><div><div class="title">' + escapeHtml(t.title) + '</div>' +
          '<div class="meta' + (b === "overdue" ? " red" : "") + '">' + meta + '</div></div></div>';
      });
      html += '</section>';
    });

    var done = tasks.filter(function (t) { return t.status === "done"; });
    if (done.length) {
      html += '<section><div class="sec-head"><span class="sec-name" style="color:#4a505b">Выполнено</span>' +
        '<span class="sec-count">' + done.length + '</span></div>';
      done.slice(0, 20).forEach(function (t) {
        html += '<div class="item done" data-id="' + t.id + '" data-status="' + t.status + '">' +
          '<div class="check"></div><div><div class="title">' + escapeHtml(t.title) + '</div></div></div>';
      });
      html += '</section>';
    }

    if (!html) html = '<div class="empty" style="text-align:center;padding:30px 0">Задач нет. Добавьте первую.</div>';
    sectionsEl.innerHTML = html;
  }

  function load() {
    fetch(SUPABASE_URL + "/rest/v1/tasks?select=*&order=due_date.asc.nullslast", { headers: headers() })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(render).catch(showError);
  }

  function createTask(title, due) {
    return fetch(SUPABASE_URL + "/rest/v1/tasks", {
      method: "POST",
      headers: headers({ "Prefer": "return=representation" }),
      body: JSON.stringify({ title: title, due_date: due, status: "open" })
    }).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw new Error(t.slice(0, 200)); });
      return r.json();
    });
  }

  function add() {
    var title = titleEl.value.trim();
    if (!title) { titleEl.focus(); return; }
    msgEl.style.display = "none";
    var due = null;
    if (selectedDays !== "") {
      var d = today(); d.setDate(d.getDate() + Number(selectedDays)); due = isoDate(d);
    }
    createTask(title, due).then(function () { titleEl.value = ""; setDays(""); load(); }).catch(showError);
  }

  function toggle(id, status) {
    var next = status === "done" ? "open" : "done";
    fetch(SUPABASE_URL + "/rest/v1/tasks?id=eq." + id, {
      method: "PATCH", headers: headers(),
      body: JSON.stringify({ status: next, done_at: next === "done" ? new Date().toISOString() : null })
    }).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return load(); }).catch(showError);
  }

  function setDays(v) {
    selectedDays = v;
    Array.prototype.forEach.call(chipsEl.children, function (c) {
      c.classList.toggle("active", c.dataset.days === v);
    });
  }

  /* ---------- РАЗБОР РЕЧИ ---------- */
  var weekdays = {
    "понедельник": 1, "вторник": 2, "среду": 3, "среда": 3,
    "четверг": 4, "пятницу": 5, "пятница": 5,
    "субботу": 6, "суббота": 6, "воскресенье": 0, "воскресение": 0
  };

  function parseDate(phrase) {
    var d = new Date(); d.setHours(0,0,0,0);
    var t = phrase.toLowerCase();

    if (/послезавтра/.test(t)) { d.setDate(d.getDate() + 2); return isoDate(d); }
    if (/завтра/.test(t)) { d.setDate(d.getDate() + 1); return isoDate(d); }
    if (/сегодня/.test(t)) { return isoDate(d); }

    var wk = t.match(/(?:в|во|к|до|на)\s+(понедельник|вторник|среду|среда|четверг|пятницу|пятница|субботу|суббота|воскресенье|воскресение)/);
    if (wk) {
      var target = weekdays[wk[1]];
      var cur = d.getDay();
      var shift = (target - cur + 7) % 7;
      if (shift === 0) shift = 7;
      d.setDate(d.getDate() + shift);
      return isoDate(d);
    }
    var nm = t.match(/через\s+(\d+|один|одну|два|две|три|четыре|пять|шесть|семь)\s*(день|дня|дней|недел\w*)/);
    if (nm) {
      var numMap = { "один":1, "одну":1, "два":2, "две":2, "три":3, "четыре":4, "пять":5, "шесть":6, "семь":7 };
      var n = numMap[nm[1]] || parseInt(nm[1], 10) || 1;
      if (/недел/.test(nm[2])) n = n * 7;
      d.setDate(d.getDate() + n);
      return isoDate(d);
    }
    var dd = t.match(/(\d{1,2})[.\s](\d{1,2})(?:[.\s](\d{2,4}))?/);
    if (dd) {
      var day = parseInt(dd[1], 10), mon = parseInt(dd[2], 10) - 1;
      var year = dd[3] ? (dd[3].length === 2 ? 2000 + parseInt(dd[3], 10) : parseInt(dd[3], 10)) : d.getFullYear();
      var cand = new Date(year, mon, day);
      if (cand < d && !dd[3]) cand.setFullYear(year + 1);
      if (!isNaN(cand.getTime())) return isoDate(cand);
    }
    return null;
  }

  function splitPhrases(text) {
    return text
      .split(/(?:,|;|\.|\s+и\s+|\s+потом\s+|\s+затем\s+|\s+ещё\s+|\s+еще\s+|\s+также\s+|\s+плюс\s+)/i)
      .map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length > 2; });
  }

  function cleanTitle(phrase) {
    return phrase
      .replace(/\b(сегодня|завтра|послезавтра)\b/gi, "")
      .replace(/\b(в|во|к|до|на)\s+(понедельник|вторник|среду|среда|четверг|пятницу|пятница|субботу|суббота|воскресенье|воскресение)\b/gi, "")
      .replace(/через\s+(\d+|один|одну|два|две|три|четыре|пять|шесть|семь)\s*(день|дня|дней|недел\w*)/gi, "")
      .replace(/\b(\d{1,2})[.\s](\d{1,2})([.\s]\d{2,4})?\b/g, "")
      .replace(/\s+/g, " ")
      .replace(/^[\s,;.\-–—]+|[\s,;.\-–—]+$/g, "")
      .trim();
  }

  function handleSpeech(text) {
    transcriptEl.textContent = text;
    transcriptEl.classList.add("on");
    var phrases = splitPhrases(text);
    var jobs = [];
    phrases.forEach(function (p) {
      var due = parseDate(p);
      var title = cleanTitle(p);
      if (!title) title = p.trim();
      if (title) jobs.push(createTask(title.charAt(0).toUpperCase() + title.slice(1), due));
    });
    if (!jobs.length) { showError("Не разобрала ни одной задачи."); return; }
    Promise.all(jobs).then(load).then(function () {
      setTimeout(function () {
        transcriptEl.textContent = "Создано задач: " + jobs.length + " — «" + text + "»";
      }, 400);
    }).catch(showError);
  }

  /* ---------- МИКРОФОН ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recognition = null;
  var listening = false;

  voiceBtn.addEventListener("click", function () {
    if (!SR) {
      showError("Ваш браузер не поддерживает распознавание речи. Напишите текстом — или откройте сайт в Chrome.");
      return;
    }
    if (listening) { recognition.stop(); return; }

    recognition = new SR();
    recognition.lang = "ru-RU";
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.onstart = function () {
      listening = true;
      voiceBtn.classList.add("rec");
      voiceIcon.textContent = "⏹";
      voiceLabel.textContent = "Говорите… (нажмите, чтобы закончить)";
      transcriptEl.classList.add("on");
      transcriptEl.textContent = "Слушаю…";
    };

    recognition.onresult = function (ev) {
      var text = "";
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        text += ev.results[i][0].transcript;
      }
      transcriptEl.textContent = text;
      ev.__finalText = text;
      lastText = text;
      if (ev.results[ev.results.length - 1].isFinal) finalText = text;
    };

    var lastText = "", finalText = "";

    recognition.onerror = function (ev) {
      listening = false;
      voiceBtn.classList.remove("rec");
      voiceIcon.textContent = "🎤";
      voiceLabel.textContent = "Сказать задачу";
      var map = {
        "not-allowed": "Нет доступа к микрофону. Разрешите его в настройках браузера.",
        "no-speech": "Ничего не услышала. Попробуйте ещё раз.",
        "network": "Нет связи с сервисом распознавания. Включите VPN и повторите.",
        "audio-capture": "Микрофон не найден."
      };
      showError(map[ev.error] || ("Ошибка распознавания: " + ev.error));
    };

    recognition.onend = function () {
      listening = false;
      voiceBtn.classList.remove("rec");
      voiceIcon.textContent = "🎤";
      voiceLabel.textContent = "Сказать задачу";
      var text = (finalText || lastText || "").trim();
      if (text) handleSpeech(text);
    };

    try { recognition.start(); } catch (e) { showError(e); }
  });

  chipsEl.addEventListener("click", function (e) {
    var chip = e.target.closest(".chip");
    if (chip) setDays(chip.dataset.days);
  });
  document.getElementById("add-btn").addEventListener("click", add);
  titleEl.addEventListener("keydown", function (e) { if (e.key === "Enter") add(); });
  sectionsEl.addEventListener("click", function (e) {
    var item = e.target.closest(".item");
    if (item && e.target.classList.contains("check")) toggle(item.dataset.id, item.dataset.status);
  });

  load();
</script>

</body>
</html>
