<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мои задачи</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 16px 14px 90px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0e0f12; color: #e8e9ec;
    min-height: 100vh;
  }
  h1 { font-size: 22px; margin: 6px 0 18px; font-weight: 650; letter-spacing: -0.3px; }
  .card {
    background: #17191e; border: 1px solid #24272e; border-radius: 14px;
    padding: 16px; margin-bottom: 14px;
  }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; color: #7c828f; margin-bottom: 8px; }
  .value { font-size: 15px; line-height: 1.45; word-break: break-word; }
  .ok { color: #4ade80; }
  .err { color: #f87171; }
  .hint { font-size: 13px; color: #7c828f; line-height: 1.5; margin-top: 6px; }
</style>
</head>
<body>

<h1>Мои задачи</h1>

<div class="card">
  <div class="label">Подключение к базе</div>
  <div class="value" id="db-status">Проверяю…</div>
  <div class="hint" id="db-hint"></div>
</div>

<div class="card">
  <div class="label">Задач в базе</div>
  <div class="value" id="count">—</div>
</div>

<script>
  const SUPABASE_URL = "https://gzoiwzxeejapecbjytyw.supabase.co";
  const SUPABASE_KEY = "sb_publishable_DCvY5Oi1weqMDlztu7PrfQ_VAdXVrWl";

  const statusEl = document.getElementById("db-status");
  const hintEl = document.getElementById("db-hint");
  const countEl = document.getElementById("count");

  async function check() {
    try {
      const res = await fetch(
        SUPABASE_URL + "/rest/v1/tasks?select=id",
        { headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY } }
      );
      if (!res.ok) throw new Error("HTTP " + res.status + " — " + res.statusText);
      const rows = await res.json();
      statusEl.textContent = "Связь есть";
      statusEl.className = "value ok";
      hintEl.textContent = "Сайт успешно читает таблицу tasks.";
      countEl.textContent = rows.length;
    } catch (e) {
      statusEl.textContent = "Ошибка: " + e.message;
      statusEl.className = "value err";
      hintEl.textContent = "Пришлите эту строку в чат — разберёмся.";
    }
  }
  check();
</script>

</body>
</html>
