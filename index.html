<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мои задачи</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 16px 14px 100px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0e0f12; color: #e8e9ec;
    min-height: 100vh;
  }
  h1 { font-size: 22px; margin: 6px 0 16px; font-weight: 650; letter-spacing: -0.3px; }
  .add-box {
    background: #17191e; border: 1px solid #24272e; border-radius: 14px;
    padding: 12px; margin-bottom: 18px;
  }
  .row { display: flex; gap: 8px; }
  input[type="text"], input[type="date"] {
    width: 100%; background: #0e0f12; border: 1px solid #2c3038; border-radius: 10px;
    padding: 12px; color: #e8e9ec; font-size: 15px; font-family: inherit;
    outline: none;
  }
  input[type="date"] { margin-top: 8px; color-scheme: dark; }
  input::placeholder { color: #5f6673; }
  button.primary {
    margin-top: 8px; width: 100%; padding: 13px;
    background: #e8e9ec; color: #0e0f12; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer;
  }
  button.primary:active { opacity: 0.7; }
  .item {
    display: flex; align-items: flex-start; gap: 10px;
    background: #17191e; border: 1px solid #24272e; border-radius: 12px;
    padding: 13px; margin-bottom: 8px;
  }
  .item.done { opacity: 0.45; }
  .item.done .title { text-decoration: line-through; }
  .check {
    width: 22px; height: 22px; flex: 0 0 22px; margin-top: 1px;
    border: 2px solid #3a3f49; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .item.done .check { background: #4ade80; border-color: #4ade80; }
  .item.done .check::after { content: "✓"; color: #0e0f12; font-size: 13px; font-weight: 700; }
  .title { font-size: 15px; line-height: 1.4; word-break: break-word; }
  .date { font-size: 12px; color: #7c828f; margin-top: 4px; }
  .empty { color: #5f6673; font-size: 14px; text-align: center; padding: 24px 0; }
  .msg { font-size: 13px; color: #f87171; margin-top: 8px; display: none; }
</style>
</head>
<body>

<h1>Мои задачи</h1>

<div class="add-box">
  <input type="text" id="title" placeholder="Что нужно сделать?" autocomplete="off">
  <input type="date" id="due">
  <button class="primary" id="add-btn">Добавить</button>
  <div class="msg" id="msg"></div>
</div>

<div id="list"></div>

<script>
  var SUPABASE_URL = "https://gzoiwzxeejapecbjytyw.supabase.co";
  var SUPABASE_KEY = "sb_publishable_DCvY5Oi1weqMDlztu7PrfQ_VAdXVrWl";

  var titleEl = document.getElementById("title");
  var dueEl = document.getElementById("due");
  var listEl = document.getElementById("list");
  var msgEl = document.getElementById("msg");

  function headers(extra) {
    var h = { "apikey": SUPABASE_KEY, "Content-Type": "application/json" };
    if (extra) for (var k in extra) h[k] = extra[k];
    return h;
  }

  function showError(e) {
    msgEl.textContent = String(e.message || e);
    msgEl.style.display = "block";
  }

  function fmtDate(d) {
    if (!d) return "";
    var parts = d.split("-");
    return parts[2] + "." + parts[1] + "." + parts[0];
  }

  function render(tasks) {
    if (!tasks.length) {
      listEl.innerHTML = '<div class="empty">Пока пусто. Добавьте первую задачу.</div>';
      return;
    }
    listEl.innerHTML = tasks.map(function (t) {
      var done = t.status === "done";
      return '<div class="item' + (done ? " done" : "") + '" data-id="' + t.id + '" data-status="' + t.status + '">' +
        '<div class="check"></div>' +
        '<div><div class="title">' + escapeHtml(t.title) + '</div>' +
        (t.due_date ? '<div class="date">до ' + fmtDate(t.due_date) + '</div>' : "") +
        '</div></div>';
    }).join("");
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function load() {
    fetch(SUPABASE_URL + "/rest/v1/tasks?select=*&order=created_at.desc", { headers: headers() })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(render)
      .catch(showError);
  }

  function add() {
    var title = titleEl.value.trim();
    if (!title) { titleEl.focus(); return; }
    msgEl.style.display = "none";
    var body = { title: title, due_date: dueEl.value || null, status: "open" };
    fetch(SUPABASE_URL + "/rest/v1/tasks", {
      method: "POST",
      headers: headers({ "Prefer": "return=representation" }),
      body: JSON.stringify(body)
    })
      .then(function (r) { if (!r.ok) return r.text().then(function (t) { throw new Error(t.slice(0, 200)); }); return r.json(); })
      .then(function () {
        titleEl.value = ""; dueEl.value = "";
        load();
      })
      .catch(showError);
  }

  function toggle(id, status) {
    var next = status === "done" ? "open" : "done";
    fetch(SUPABASE_URL + "/rest/v1/tasks?id=eq." + id, {
      method: "PATCH",
      headers: headers(),
      body: JSON.stringify({ status: next, done_at: next === "done" ? new Date().toISOString() : null })
    })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return load(); })
      .catch(showError);
  }

  document.getElementById("add-btn").addEventListener("click", add);
  titleEl.addEventListener("keydown", function (e) { if (e.key === "Enter") add(); });
  listEl.addEventListener("click", function (e) {
    var item = e.target.closest(".item");
    if (item && e.target.classList.contains("check")) toggle(item.dataset.id, item.dataset.status);
  });

  load();
</script>

</body>
</html>
