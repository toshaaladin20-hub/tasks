<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мои задачи</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 16px 14px 90px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0e0f12; color: #e8e9ec;
    min-height: 100vh;
  }
  h1 { font-size: 22px; margin: 6px 0 18px; font-weight: 650; letter-spacing: -0.3px; }
  .card {
    background: #17191e; border: 1px solid #24272e; border-radius: 14px;
    padding: 16px; margin-bottom: 14px;
  }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; color: #7c828f; margin-bottom: 8px; }
  .value { font-size: 15px; line-height: 1.45; word-break: break-word; }
  .ok { color: #4ade80; }
  .err { color: #f87171; }
  .hint { font-size: 13px; color: #7c828f; line-height: 1.5; margin-top: 6px; }
</style>
</head>
<body>

<h1>Мои задачи</h1>

<div class="card">
  <div class="label">Подключение к базе</div>
  <div class="value" id="db-status">Проверяю…</div>
  <div class="hint" id="db-hint"></div>
</div>

<div class="card">
  <div class="label">Задач в базе</div>
  <div class="value" id="count">—</div>
</div>

<script>
  var SUPABASE_URL = "https://gzoiwzxeejapecbjytyw.supabase.co";
  var SUPABASE_KEY = "sb_publishable_DCvY5Oi1weqMDlztu7PrfQ_VAdXVrWl";

  var statusEl = document.getElementById("db-status");
  var hintEl = document.getElementById("db-hint");
  var countEl = document.getElementById("count");

  function show(text, cls, hint) {
    statusEl.textContent = text;
    statusEl.className = "value " + cls;
    if (hint) hintEl.textContent = hint;
  }

  fetch(SUPABASE_URL + "/rest/v1/tasks?select=id", {
    headers: { "apikey": SUPABASE_KEY }
  })
  .then(function (res) {
    if (!res.ok) {
      return res.text().then(function (body) {
        throw new Error("HTTP " + res.status + " — " + body.slice(0, 200));
      });
    }
    return res.json();
  })
  .then(function (rows) {
    show("Связь есть", "ok", "Сайт успешно читает таблицу tasks.");
    countEl.textContent = rows.length;
  })
  .catch(function (e) {
    show("Ошибка: " + e.message, "err", "Пришлите эту строку в чат — разберёмся.");
  });
</script>

</body>
</html>
